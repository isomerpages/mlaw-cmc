"0">评估</tspan></text><text transform="translate(955.12 3231.23)" class="cls-12"><tspan y="0" x="0">当双方同意参加后，我们会安排调解，</tspan><tspan y="72" x="0">并通知您日期、时间和地点。</tspan></text><text transform="translate(955.12 3116.56)" class="cls-7"><tspan y="0" x="0">安排时间</tspan></text></g></svg>